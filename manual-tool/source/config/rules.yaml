remove_block_marker_patterns:
  - pattern: "\\[T\\.B\\.D\\.?[^\\]]*\\]"
    name: "T.B.Dブロック"
  - pattern: "\\[将来対応\\.?[^\\]]*\\]"
    name: "将来対応ブロック"

required_sections:
  - {level: 1, title: "概要"}
  - {level: 1, title: "機能仕様"}
  - {level: 2, title: "入力"}
  - {level: 2, title: "出力"}
  - {level: 2, title: "異常時動作"}
  - {level: 1, title: "注意事項"}

ambiguous_words:
  - "適切に"
  - "必要に応じて"
  - "原則として"
  - "基本的に"
  - "できるだけ"
  - "可能な限り"
  - "任意の"
  - "所定の"
  - "正常に"
  - "異常"
  - "適宜"
  - "十分に"
  - "速やかに"
  - "ただちに"
  - "など"
  - "等"
  - "場合がある"
  - "ことがある"
  - "想定される"
  - "考慮する"
  - "確認する"
  - "処理する"
  - "制御する"
  - "実行する"

preferred_terms:
  "下さい": "ください"
  "出来る": "できる"
  "出来ます": "できます"
  "ｴﾗｰ": "エラー"
  "G-Code": "Gコード"
  "G code": "Gコード"

long_line_limit: 120
